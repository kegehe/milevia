name: milevia

# 单域名入口由外部 Caddy/Nginx 负责：
#   /          -> apps/web/dist
#   /health    -> cloud-control:8090/health
#   /v1/*      -> cloud-control:8090/v1/*（包含 Agent WebSocket）
# compose 只将 Cloud Control 绑定到本机，避免绕过反向代理直接暴露服务。

services:
  cloud-control:
    build:
      context: ..
      dockerfile: apps/cloud-control/Dockerfile
    environment:
      MILEVIA_CLOUD_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MILEVIA_CLOUD_AGENT_TOKENS: ${MILEVIA_CLOUD_AGENT_TOKENS}
      MILEVIA_CLOUD_USER_TOKEN: ${MILEVIA_CLOUD_USER_TOKEN}
      MILEVIA_CLOUD_APP_URL: ${MILEVIA_CLOUD_APP_URL}
      MILEVIA_CLOUD_ADDR: :8090
    ports:
      - "127.0.0.1:${CLOUD_CONTROL_PORT}:8090"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
