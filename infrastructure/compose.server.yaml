name: milevia

# 旧服务器（111.229.52.158）的部署变体：复用外部 Docker network
# `keyanjia-network` 上的 PostgreSQL。2026-10 迁移后的新服务器
# （8.153.198.174）使用 `docker run --network host` + 宿主本地 PostgreSQL，
# 不再使用本文件；保留仅作历史参考，见 docs/35-发布操作手册.md。
services:
  cloud-control:
    build:
      context: ..
      dockerfile: apps/cloud-control/Dockerfile
    environment:
      MILEVIA_CLOUD_DATABASE_URL: ${MILEVIA_CLOUD_DATABASE_URL:?set PostgreSQL URL}
      MILEVIA_CLOUD_AGENT_TOKENS: ${MILEVIA_CLOUD_AGENT_TOKENS:-}
      MILEVIA_CLOUD_ENROLLMENT_TOKEN: ${MILEVIA_CLOUD_ENROLLMENT_TOKEN:-}
      MILEVIA_CLOUD_USER_TOKEN: ${MILEVIA_CLOUD_USER_TOKEN:?set user token}
      MILEVIA_CLOUD_APP_URL: ${MILEVIA_CLOUD_APP_URL:?set public URL}
      MILEVIA_CLOUD_ADDR: :8090
    ports:
      - "127.0.0.1:${CLOUD_CONTROL_PORT:-8090}:8090"
    networks:
      - keyanjia-network
    restart: unless-stopped

networks:
  keyanjia-network:
    external: true
