[package]
name = "milevia-desktop"
version = "0.1.1"
description = "Milevia Windows desktop host"
authors = ["Milevia"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-updater = "2"
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4"] }
